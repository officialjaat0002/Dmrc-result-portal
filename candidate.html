<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#8b0000">

    <title>Candidate Login - Result Portal</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="brand">

        <div class="brand-logo">
            🎓
        </div>

        <div class="brand-text">

            <h1>
                Result Portal
            </h1>

            <p>
                Candidate Data Access
            </p>

        </div>

    </div>


    <nav class="desktop-nav">

        <a href="index.html">
            Home
        </a>

        <a href="exam-info.html">
            Exam Info
        </a>

        <a href="info.html">
            Information
        </a>

        <a
            href="candidate.html"
            class="active">

            👤 Login

        </a>

    </nav>

</header>



<!-- ================= LOGIN ================= -->

<main class="login-page">


    <section class="login-box">


        <div class="login-symbol">
            🔐
        </div>


        <h2>
            Candidate Login
        </h2>


        <p class="subtitle">

            Enter your credentials
            to continue.

        </p>


        <form id="candidateLogin">


            <!-- ROLL NUMBER -->

            <div class="form-group">

                <label for="rollNumber">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Enter Roll Number"
                    autocomplete="off"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="off"
                    required>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button">

                Login & Continue →

            </button>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error">
            </div>


        </form>


        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>


    </section>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="footer-left">

        🛡️

        <span>Transparent</span>

        <i>|</i>

        <span>Reliable</span>

    </div>


    <div class="footer-right">

        © 2026 Result Portal

    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
