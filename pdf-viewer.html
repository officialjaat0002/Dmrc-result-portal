<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Card</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #222;
}

body {
    padding-top: 58px;
    overflow-x: hidden;
}

/* TOP BAR */

.toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;

    background: #8b0000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px 12px;

    z-index: 9999;

    box-shadow: 0 2px 8px rgba(0,0,0,.45);
}

.title {
    color: white;
    font: bold 16px Arial, sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 10px;
}

.download-btn {
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 40px;
    padding: 0 14px;

    background: white;
    color: #8b0000;

    border-radius: 6px;

    text-decoration: none;

    font: bold 14px Arial, sans-serif;
}

.download-btn:active {
    transform: scale(.97);
}

/* PDF */

#loading {
    color: white;
    text-align: center;
    padding: 35px 15px;
    font: 15px Arial, sans-serif;
}

#pdf-container {
    width: 100%;
    padding: 10px 0 25px;
}

.page-box {
    width: 100%;
    margin: 0 auto 12px;
    background: white;

    box-shadow: 0 2px 8px rgba(0,0,0,.45);

    overflow: hidden;
}

.page {
    display: block;

    width: 100%;
    height: auto;
}
</style>

</head>

<body>

<!-- TOP BAR -->

<div class="toolbar">

    <div class="title">
        Score Card
    </div>

    <a
        class="download-btn"
        href="./SCORE_CARD_DMRC_2026004321.pdf"
        download="SCORE_CARD_DMRC_2026004321.pdf">

        ⬇ Download

    </a>

</div>


<div id="loading">
    Loading Score Card...
</div>


<div id="pdf-container"></div>


<script>

const PDF_FILE =
"./SCORE_CARD_DMRC_2026004321.pdf";

const container =
document.getElementById("pdf-container");

const loading =
document.getElementById("loading");


async function renderPDF() {

    try {

        if (typeof pdfjsLib === "undefined") {
            throw new Error("PDF.js did not load.");
        }


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


        const pdf =
        await pdfjsLib.getDocument({
            url: PDF_FILE,
            disableAutoFetch: false,
            disableStream: false
        }).promise;


        loading.style.display = "none";


        /*
         * Render at higher resolution.
         * This keeps the displayed page sharp
         * while fitting it to the phone screen.
         */

        const dpr =
        Math.min(
            Math.max(window.devicePixelRatio || 1, 2),
            4
        );


        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {

            const page =
            await pdf.getPage(pageNumber);


            const base =
            page.getViewport({
                scale: 1
            });


            const screenWidth =
            window.innerWidth;


            /*
             * Extra resolution multiplier
             */

            const displayScale =
            screenWidth / base.width;


            const renderScale =
            displayScale * dpr;


            const renderViewport =
            page.getViewport({
                scale: renderScale
            });


            const displayViewport =
            page.getViewport({
                scale: displayScale
            });


            const box =
            document.createElement("div");

            box.className =
            "page-box";


            const canvas =
            document.createElement("canvas");

            canvas.className =
            "page";


            /*
             * High physical resolution
             */

            canvas.width =
            Math.ceil(renderViewport.width);

            canvas.height =
            Math.ceil(renderViewport.height);


            /*
             * Normal mobile display size
             */

            canvas.style.width =
            Math.ceil(displayViewport.width) + "px";

            canvas.style.height =
            Math.ceil(displayViewport.height) + "px";


            const context =
            canvas.getContext("2d", {
                alpha: false
            });


            box.appendChild(canvas);

            container.appendChild(box);


            await page.render({

                canvasContext: context,

                viewport: renderViewport

            }).promise;

        }

    }

    catch (error) {

        console.error(
            "PDF ERROR:",
            error
        );

        loading.innerHTML =
        "Unable to display the PDF.";

    }

}


renderPDF();

</script>

</body>
</html>
